# /etc/nginx/sites-available/lfs_validator
# MAXIMUM SECURITY CONFIGURATION
# This config allows ONLY your specific remote website IP to access the API.
# It effectively acts as a Firewall.

server {
    listen 80;
    
    # Change this to your Validator's Domain or IP
    server_name validator.example.com;

    # 1. Block everything by default
    location / {
        return 403; 
    }

    # 2. Allow API Access ONLY from specific IPs
    location /api/ {
        # REPLACE 5.6.7.8 WITH YOUR WEBSITE'S IP ADDRESS
        allow 5.6.7.8;
        
        # Deny everyone else (Hackers, Random Internet)
        deny all;

        # Proxy to the Local P2P Node (which is locked to 127.0.0.1)
        proxy_pass http://127.0.0.1:8080/;
        
        # Security Headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
    }
}
